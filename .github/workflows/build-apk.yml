name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir proyecto
        run: |
          mkdir source
          unzip -o *.zip -d source

      - name: Compilar APK
        run: |
          WRAPPER=$(find source -name gradlew -type f | head -n 1)
          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolAimAssistant-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
